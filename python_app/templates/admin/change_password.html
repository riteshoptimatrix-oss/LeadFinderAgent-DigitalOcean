{% extends "admin/base.html" %}
{% block content %}
<div style="max-width:460px;">
    <div class="panel">
        <div class="panel-header"><h2>🔑 Change Password</h2></div>
        <div class="panel-body">
            <form method="POST" action="/admin/change_password">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <div style="margin-bottom:14px;"><label style="display:block;font-size:12px;margin-bottom:5px;">Current Password</label><input type="password" name="current_password" required style="width:100%;"></div>
                <div style="margin-bottom:14px;"><label style="display:block;font-size:12px;margin-bottom:5px;">New Password (min 8 chars)</label><input type="password" name="new_password" required minlength="8" style="width:100%;"></div>
                <div style="margin-bottom:18px;"><label style="display:block;font-size:12px;margin-bottom:5px;">Confirm New Password</label><input type="password" name="confirm_password" required minlength="8" style="width:100%;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
