[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Do not treat stray *.txt files (e.g. UTF-16 console dumps named test_out.txt
# produced by the environment) as doctest sources - they are not test modules.
doctest_glob =
# Belt-and-braces: never collect stray *.txt artifacts as test modules.
collect_ignore_glob =
    *.txt
