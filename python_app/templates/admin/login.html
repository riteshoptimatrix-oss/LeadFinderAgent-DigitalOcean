<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – Easy Message Sender (Python)</title>
<link rel="icon" type="image/png" href="/images/logo_transparent.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --green: #25d366; --green-dk: #128c7e; --dark: #0f172a; --card: #1e293b; --border: #334155; --muted: #94a3b8; --text: #e2e8f0; --text-bright: #ffffff; --input-bg: #0f172a; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,0.5)}
.logo{text-align:center;margin-bottom:28px}
.login-brand-icon{height:54px;width:54px;object-fit:contain;margin-bottom:12px;border-radius:12px}
.logo h1{font-size:20px;font-weight:700;color:var(--text-bright);margin-bottom:4px}
.logo p{font-size:13px;color:var(--muted)}
.alert{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:20px}
.form-group{margin-bottom:20px}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
input[type=text],input[type=password]{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text-bright);border-radius:8px;padding:12px 16px;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:var(--green)}
.btn-login{width:100%;background:linear-gradient(135deg,var(--green),var(--green-dk));color:#fff;border:none;border-radius:8px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.footer-note{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <img src="/images/logo_transparent.png" alt="Easy Message Sender" class="login-brand-icon">
        <h1>Easy Message Sender</h1>
        <p>Python Email Marketing Admin Panel</p>
    </div>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username_val }}" placeholder="admin" required {{ 'disabled' if rate_blocked else '' }}>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required {{ 'disabled' if rate_blocked else '' }}>
        </div>
        <button type="submit" class="btn-login" {{ 'disabled' if rate_blocked else '' }}>Sign In →</button>
    </form>
    <p class="footer-note">Default: admin / Admin@1234 — change immediately</p>
</div>
</body>
</html>
