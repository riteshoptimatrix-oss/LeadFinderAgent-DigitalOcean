{% extends "admin/base.html" %}
{% block content %}
<div style="max-width:780px;margin:0 auto;">
    <div style="margin-bottom:14px;"><a href="/admin/leads" class="btn btn-outline btn-sm">← Back to All Leads</a></div>
    <div class="panel">
        <div class="panel-header"><h2>{{ '✏️ Edit Lead' if is_edit else '➕ Add Lead Manually' }}</h2></div>
        <div class="panel-body">
            <form method="POST" action="/admin/lead_form{{ '?id=' ~ lead.id if is_edit else '' }}">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <input type="hidden" name="id" value="{{ lead.id }}">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">First Name</label><input type="text" name="first_name" value="{{ lead.first_name }}" style="width:100%;"></div>
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">Last Name</label><input type="text" name="last_name" value="{{ lead.last_name }}" style="width:100%;"></div>
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">Email *</label><input type="email" name="email" required value="{{ lead.email }}" style="width:100%;"></div>
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">Job Title</label><input type="text" name="title" value="{{ lead.title }}" style="width:100%;"></div>
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">Company</label><input type="text" name="company" value="{{ lead.company }}" style="width:100%;"></div>
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">Status</label>
                        <select name="status" style="width:100%;">
                            {% for s in ['new','sent','bounced','unsubscribed','failed'] %}
                            <option value="{{ s }}" {{ 'selected' if lead.status == s else '' }}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">City</label><input type="text" name="city" value="{{ lead.city }}" style="width:100%;"></div>
                    <div><label style="display:block;font-size:12px;margin-bottom:5px;">Country</label><input type="text" name="country" value="{{ lead.country }}" style="width:100%;"></div>
                </div>
                <hr style="border:none;border-top:1px solid var(--border);margin:18px 0;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;">
                    <div>
                        <label style="display:block;font-size:12px;margin-bottom:5px;">Template (for Save &amp; Send)</label>
                        <select name="template_id" style="width:100%;">
                            {% for t in templates %}
                            <option value="{{ t.id }}" {{ 'selected' if t.id == default_template.id else '' }}>{{ t.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label style="display:block;font-size:12px;margin-bottom:5px;">Email Subject</label>
                        <input type="text" name="email_subject" value="{{ default_template.subject }}" style="width:100%;">
                    </div>
                </div>
                <div style="display:flex;gap:10px;">
                    <button type="submit" name="form_action" value="save" class="btn btn-outline">💾 Save Lead</button>
                    <button type="submit" name="form_action" value="save_and_send" class="btn btn-primary">🚀 Save &amp; Send Email Now</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
